name: Bug
description: Report something that is not working as expected
type: EM Bug
projects: AneoGroup/projects/57
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting the problem. Please include enough information
        for someone else to understand and reproduce it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behaviour.
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: Describe the expected behaviour...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include steps, inputs, timestamps, or other relevant details.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, links, environment information, etc.
